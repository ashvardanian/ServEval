[package]
name = "serveval"
version = "1.0.0-rc.1"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.100"
description = "Agentic-scale serving benchmarks, each framework driven by its own client"
repository = "https://github.com/ashvardanian/ServEval"
publish = false

[lib]
path = "lib.rs"

[[bin]]
name = "serv-eval-axum-server"
path = "axum_server.rs"
required-features = ["axum"]

[[bin]]
name = "serv-eval-hyper-client"
path = "hyper_client.rs"
required-features = ["axum"]

[[bin]]
name = "serv-eval-actix-server"
path = "actix_server.rs"
required-features = ["actix"]

[[bin]]
name = "serv-eval-awc-client"
path = "awc_client.rs"
required-features = ["actix"]

[[bin]]
name = "serv-eval-tonic-server"
path = "tonic_server.rs"
required-features = ["tonic"]

[[bin]]
name = "serv-eval-tonic-client"
path = "tonic_client.rs"
required-features = ["tonic"]

[[bin]]
name = "serv-eval-ucall-server"
path = "ucall_server.rs"
required-features = ["ucall"]

[[bin]]
name = "serv-eval-ucall-client"
path = "ucall_client.rs"
required-features = ["ucall"]

[dependencies]
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
futures = "0.3"
libc = "0.2"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = { version = "0.6", features = ["all"] }
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "signal", "sync", "macros"] }
tokio-rustls = "0.26"
axum = { version = "0.8", optional = true }
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", optional = true, features = ["client", "http1"] }
hyper-rustls = { version = "0.27", optional = true, default-features = false, features = ["http1"] }
hyper-util = { version = "0.1", optional = true, features = ["client-legacy", "http1", "tokio"] }
actix-web = { version = "4", optional = true, default-features = false, features = ["macros", "rustls-0_23"] }
awc = { version = "3", optional = true, default-features = false, features = ["rustls-0_23"] }
actix-tls = { version = "3", optional = true, default-features = false, features = ["connect"] }
prost = { version = "0.14", optional = true }
tonic = { version = "0.14", optional = true, features = ["tls-connect-info"] }
tonic-prost = { version = "0.14", optional = true }
tower = { version = "0.5", optional = true, features = ["util"] }
ucall = { version = "1.0.0-rc.1", git = "https://github.com/unum-cloud/UCall", rev = "65fb9cc2c9275f43372d4889c2c2861a511e0055", optional = true }

[build-dependencies]
tonic-prost-build = { version = "0.14", optional = true }

[dev-dependencies]
sha2 = "0.10"

[features]
default = ["axum", "actix", "tonic", "ucall"]
axum = ["dep:axum", "dep:http-body-util", "dep:hyper", "dep:hyper-rustls", "dep:hyper-util"]
actix = ["dep:actix-web", "dep:awc", "dep:actix-tls"]
tonic = ["dep:prost", "dep:tonic", "dep:tonic-prost", "dep:tonic-prost-build", "dep:tower", "dep:hyper-util"]
ucall = ["dep:ucall"]

[profile.release]
lto = "thin"
codegen-units = 1
